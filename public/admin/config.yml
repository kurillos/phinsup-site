backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Articles de Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date de publication", name: "pubDate", widget: "datetime" }
      - { label: "Image de couverture", name: "heroImage", widget: "image" }
      - { 
          label: "Catégorie", 
          name: "category", 
          widget: "select", 
          options: ["Actu", "Analyse", "Histoire", "Breaking News"] 
        }
      - { label: "Mots-clés SEO", name: "tags", widget: "list", default: ["Miami Dolphins", "NFL France"] }
      - { label: "Cacher l'article ?", name: "draft", widget: "boolean", default: false }
      - { label: "Corps de l'article", name: "body", widget: "markdown" }
      - {
          label: "Auteur",
          name: "author",
          widget: "select",
          options: ["Cyril", "Lucas", "Erwan", "Redaction Thze French Fins"],
          default: "Rédaction The French Fins"
      }
  - name: "podcasts"
    label: "Podcasts"
    folder: "src/content/podcasts"
    create: true
    fields:
      - { label: "Titre de l'épisode", name: "title", widget: "string" }
      - { label: "Date de publication", name: "pubDate", widget: "datetime" }
      - { label: "URL Spotify", name: "spotifyUrl", widget: "string", hint: "Ex: https://open.spotify.com/episode/XXXXXX" }
      - { label: "Description", name: "description", widget: "text" }
  import { defineCollection, z } from 'astro:content';

const blog = defineCollection({
	schema: z.object({
		title: z.string(),
		description: z.string(),
		pubDate: z.coerce.date(),
		updatedDate: z.coerce.date().optional(),
		heroImage: z.string().optional(),
		category: z.string().catch('Actu'), 
		author: z.enum([
            "The French Fins Staff", 
            "Cyril", 
            "Lucas", 
			"Erwan"
        ]).catch('The French Fins Staff'),
		tags: z.array(z.string()).optional().default(["Miami Dolphins"]),
		isDraft: z.boolean().optional().default(false),
	}),
});

const podcasts = defineCollection({
	type: 'content',
	schema: z.object({
		title: z.string(),
		pubDate: z.coerce.date(),
		description: z.string().optional(),
		spotifyUrl: z.string().url(),
		cover: z.string().optional(),
		episode: z.string().optional(),
	}),
});

const evenements = defineCollection({
	type: 'content',
	schema: z.object({
		title: z.string(),
		eventDate: z.coerce.date(),
		location: z.string().optional(),
		link: z.string().url().optional(),
		description: z.string().optional(),
		isDraft: z.boolean().optional().default(false),
	}),
});

export const collections = { blog, podcasts, evenements };
